<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Kalkulačka dátumov</title>
<style>
body {
  font-family: -apple-system, Arial, sans-serif;
  max-width: 460px;
  margin: 0 auto;
  padding: 24px 18px;
  color: #222;
  background: #f5f6fa;
}
main {
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 3px 14px #00000010;
}
h1 { font-size: 25px; margin-top: 0; }
label { display: block; margin-top: 20px; font-weight: 600; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  font-size: 17px;
  border-radius: 10px;
}
input { border: 1px solid #ccc; }
button {
  background: #1769e0;
  color: white;
  border: 0;
  font-weight: 600;
  margin-top: 24px;
}
#result {
  margin-top: 24px;
  padding: 16px;
  background: #eef5ff;
  border-radius: 12px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
.big { font-size: 23px; font-weight: 700; }
.note { color: #666; font-size: 13px; }
</style>
</head>
<body>
<main>
<h1>📅 Kalkulačka dátumov</h1>
<p>Vypočítaj presný rozdiel medzi dvoma dátumami.</p>
<label for="start">Od dátumu</label>
<input type="date" id="start">
<label for="end">Do dátumu</label>
<input type="date" id="end">
<button onclick="calculate()">Vypočítať rozdiel</button>
<div id="result" aria-live="polite">
Vyber oba dátumy a stlač Vypočítať rozdiel.
</div>
<p class="note">Kalendárny rozdiel v rokoch, mesiacoch a dňoch aj celkový počet dní.</p>
</main>
<script>
const DAY = 86400000;
function utc(s) {
  const [y, m, d] = s.split("-").map(Number);
  return Date.UTC(y, m - 1, d);
}
function parts(t) {
  const d = new Date(t);
  return {
    y: d.getUTCFullYear(),
    m: d.getUTCMonth(),
    d: d.getUTCDate()
  };
}
function addMonths(t, n) {
  const p = parts(t);
  const monthIndex = p.y * 12 + p.m + n;
  const y = Math.floor(monthIndex / 12);
  const m = ((monthIndex % 12) + 12) % 12;
  const lastDay = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return Date.UTC(y, m, Math.min(p.d, lastDay));
}
function calculate() {
  const a = document.getElementById("start").value;
  const b = document.getElementById("end").value;
  const out = document.getElementById("result");
  if (!a || !b) {
    out.textContent = "Prosím, vyber oba dátumy.";
    return;
  }
  const start = utc(a);
  const end = utc(b);
  if (end < start) {
    out.textContent = "Koncový dátum musí byť rovnaký alebo neskorší než začiatočný dátum.";
    return;
  }
  let years = parts(end).y - parts(start).y;
  let anchor = addMonths(start, years * 12);
  if (anchor > end) {
    years--;
    anchor = addMonths(start, years * 12);
  }
  let months =
    (parts(end).y - parts(anchor).y) * 12 +
    parts(end).m - parts(anchor).m;
  let monthAnchor = addMonths(anchor, months);
  if (monthAnchor > end) {
    months--;
    monthAnchor = addMonths(anchor, months);
  }
  const days = Math.round((end - monthAnchor) / DAY);
  const totalDays = Math.round((end - start) / DAY);
  out.innerHTML =
    '<div class="big">' + years + ' rokov, ' +
    months + ' mesiacov, ' + days + ' dní</div>' +
    '<hr><strong>Celkový počet dní:</strong><br>' +
    totalDays.toLocaleString('sk-SK') + ' dní';
}
</script>
</body>
</html>
